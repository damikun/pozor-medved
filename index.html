<noscript>
  <h1>Za stromom – satirická hra o medveďovi z Liptova</h1>
  <p>Politici z medveďov robia vinníkov všetkého a poľovníci strieľajú aj tam, kde sú chránené. Doveď medveďa do brloha, najedz sa, objím aspoň raz človeka a schovaj sa za hrubý strom. Dve úrovne: leto v doline od Dolného Strachu cez skanzen v Pribyline a salaš až k Zelenému plesu vo Vysokých Tatrách, a zima na svahu v Liptovskom Mikuláši.</p>
  <p>A satirical 2D browser game about a brown bear from Liptov, Slovakia. Hra potrebuje zapnutý JavaScript.</p>
</noscript>
