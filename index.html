<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="bars">
    <div class="bar fat" id="barFat"><span></span><i></i><em style="left: 85%"></em></div>
    <div class="bar syn" id="barSyn"><span></span><i></i><em></em></div>
    <div class="bar panic" id="barPanic"><span></span><i></i></div>
    <div class="bar trip" id="barTrip"><span></span><i></i></div>
  </div>
  <div class="side">
    <div id="season"></div>
    <div id="lives"></div>
  </div>
  <div id="badges"></div>
</div>

<div id="ticker" hidden>
  <div class="tv-label">
    <div class="tv-bug"><b id="tvChannel"></b><i id="tvNum"></i></div>
    <div class="tv-flag" id="tvFlag"></div>
  </div>
  <div class="tv-body" id="tvText"></div>
</div>

<div id="touch" hidden>
  <button data-key="ArrowLeft">◀</button>
  <button data-key="ArrowRight">▶</button>
  <span class="gap"></span>
  <button data-key="ArrowDown">🌲</button>
  <button data-key="ArrowUp">⤒</button>
  <div class="act" id="act">
    <button data-key="KeyC">🤗</button>
    <button data-key="KeyX">🦷</button>
  </div>
</div>

<div id="screen" class="screen">
  <div class="card" id="screenCard"></div>
</div>

<div id="corner" hidden></div>
