<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medveď · náhľad</title>
<style>
  body { margin: 0; background: #dfe8d6; font: 14px/1.4 system-ui, sans-serif; color: #2a2f22; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #8c9a7f; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #2f5d3a; border-color: #2f5d3a; color: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<header>
  <h1>Za stromom · medveď</h1>
  <button id="pause" aria-pressed="false">Pauza (medzerník)</button>
  <button id="slow" aria-pressed="false">Spomalene ¼×</button>
  <button id="flip" aria-pressed="false">Otočiť smer</button>
</header>
<canvas id="c"></canvas>
<script src="../js/core/config.js"></script>
<script>
  // Always load the latest bear.js (no stale cache while iterating).
  document.write('<script src="../js/render/art/bear.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  const CFG = ZS.CFG, GY = CFG.GROUND, CW = 260, CH = 215, FLOOR = 178;
  // ?only=0,3 shows just those cells, large. ?sheet=2&n=6&gap=0.05 shows cell 2 at n moments, gap seconds apart.
  const qs = new URLSearchParams(location.search);
  const only = (qs.get('only') || '').split(',').filter(Boolean).map(Number);
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const ui = { paused: false, slow: false, dir: 1, time: 0, last: 0, scale: 1 };

  const DIR = qs.get('dir') === '-1' ? -1 : 1;   // ?dir=-1 starts every bear facing left
  const ALPHA = +(qs.get('alpha') || 1);          // ?alpha=0.5 draws the bears faded, like the game's hit flash
  const bear = (o) => Object.assign({ x: 0, y: GY, vy: 0, dir: DIR, onGround: true, moving: false, running: false,
    crouch: false, walkT: 0, inv: 0, hiding: null, pose: 'stiff', hideT: 0, danger: false, peekSide: 1,
    climbing: null, climbV: 0, climbT: 0, covered: false }, o);
  const tree = (h) => ({ x: 0, w: 50, h: h || 300, r: 100, kind: 'buk' });

  // The game's gravity and ground.
  function fall(b, dt) {
    if (b.onGround) return;
    b.vy += CFG.GRAVITY * dt; b.y += b.vy * dt;
    if (b.y >= GY) { b.y = GY; b.vy = 0; b.onGround = true; }
  }

  function hideCell(pose) {
    const t = tree();
    return { label: 'za stromom: ' + pose, b: bear({ pose }), tree: t, t: 0,
      sub: (b) => (b.hiding ? (b.danger ? 'nebezpečenstvo' : 'pokoj') : 'vonku'),
      step(b, dt, c) {
        c.t += dt;
        if (c.t > 7.6) { c.t = 0; b.peekSide *= -1; }
        if (c.t < 6.4) {
          if (!b.hiding) { b.hiding = t; b.hideT = 0; b.x = -14 * b.dir; }
          b.hideT += dt; b.x += (t.x - b.x) * Math.min(1, dt * 12);
          b.danger = c.t > 3.4;
        } else { b.hiding = null; b.danger = false; }
      } };
  }

  // v: -1 up, +1 down, 0 holding still.
  function climbCell(label, v, covered) {
    const t = tree(440);
    return { label, b: bear({ covered: !!covered }), tree: t, climb: true, t: 0,
      sub: (b) => (b.climbing ? (b.danger ? 'nebezpečenstvo' : b.covered ? 'v korune' : '') : 'na zemi'),
      step(b, dt, c) {
        c.t += dt;
        if (v < 0) {
          if (c.t > 5.5) { c.t = 0; b.climbing = null; b.y = GY; b.x = -26 * b.dir; b.climbV = 0; }
          if (c.t > 0.8) { if (!b.climbing) { b.climbing = t; b.climbT = 0; } b.climbT += dt; b.climbV = -1; b.y -= 55 * dt; }
        } else if (v > 0) {
          if (c.t > 5.5 || !c.init) { c.t = 0; c.init = true; b.climbing = t; b.climbT = 5; b.y = GY - 230; }
          if (b.climbing) {
            b.climbT += dt; b.climbV = 1; b.y += 55 * dt;
            if (b.y >= GY) { b.y = GY; b.climbing = null; b.climbV = 0; b.x = t.x - 26 * b.dir; }
          }
        } else {
          if (!b.climbing) { b.climbing = t; b.climbT = 5; b.y = GY - (covered ? 150 : 110); }
          b.climbT += dt; b.climbV = 0;
          if (covered) b.danger = c.t % 5 > 2.5;
        }
      } };
  }

  // The game's speeds in units per second.
  const V = { walk: 165, creep: 85, run: 290 };
  // A scripted stroll: [seconds, speed, direction] steps, repeated.
  function script(steps) {
    let t = 0;
    return (b, dt) => {
      const total = steps.reduce((a, s) => a + s[0], 0);
      t = (t + dt) % total;
      let acc = 0, cur = steps[0];
      for (const st of steps) { if (t < acc + st[0]) { cur = st; break; } acc += st[0]; }
      b.dir = cur[2] * DIR; b.moving = cur[1] > 0; b.running = cur[1] > V.walk; b.x += cur[1] * dt * b.dir;
    };
  }
  const MAKERS = [
    () => ({ label: 'idle', b: bear(), step() {} }),
    () => ({ label: 'walk 165', b: bear(), follow: true, step(b, dt) { b.moving = true; b.x += V.walk * dt * b.dir; b.walkT += dt; } }),
    () => ({ label: 'run (šprint) 290', b: bear(), follow: true,
      step(b, dt) { b.moving = b.running = true; b.x += V.run * dt * b.dir; b.walkT += dt * 1.5; } }),
    () => ({ label: 'walk + jump', b: bear(), follow: true, t: 0,
      step(b, dt, c) {
        b.moving = true; b.x += V.walk * dt * b.dir; b.walkT += dt; c.t += dt;
        if (c.t > 1.4 && b.onGround) { c.t = 0; b.vy = -CFG.JUMP; b.onGround = false; }
        fall(b, dt);
      } }),
    () => ({ label: 'jump: going up', b: bear({ onGround: false, vy: -380, y: GY - 50 }), step() {} }),
    () => ({ label: 'jump: coming down', b: bear({ onGround: false, vy: 380, y: GY - 40 }), step() {} }),
    () => ({ label: 'landing', b: bear(), t: 0,
      step(b, dt, c) { c.t += dt; if (c.t > 1.5) { c.t = 0; b.y = GY - 60; b.vy = 0; b.onGround = false; } fall(b, dt); } }),
    () => ({ label: 'crouch', b: bear({ crouch: true }), step() {} }),
    () => ({ label: 'creep (↓ + →) 85', b: bear({ crouch: true }), follow: true,
      step(b, dt) { b.moving = true; b.x += V.creep * dt * b.dir; } }),
    () => ({ label: 'walk → stop → turn → walk', b: bear(), follow: true,
      step: script([[1.6, V.walk, 1], [0.9, 0, 1], [1.6, V.walk, -1], [0.9, 0, -1]]) }),
    () => ({ label: 'run → turn', b: bear(), follow: true, step: script([[1.4, V.run, 1], [1.4, V.run, -1]]) }),
    () => ({ label: 'walk, jump onto a log', b: bear(), follow: true, t: 0, floor: GY,
      step(b, dt, c) {
        // a 30 high log every other jump: the bear lands on it, walks off it and drops to the ground
        b.moving = true; b.x += V.walk * dt * b.dir; c.t += dt;
        if (c.t > 1.3 && b.onGround) { c.t = 0; b.vy = -CFG.JUMP; b.onGround = false; c.floor = c.floor === GY ? GY - 30 : GY; }
        if (b.onGround && b.y < GY && c.t > 0.7) b.onGround = false;
        if (!b.onGround) { b.vy += CFG.GRAVITY * dt; b.y += b.vy * dt; if (b.y >= c.floor && b.vy > 0) { b.y = c.floor; b.vy = 0; b.onGround = true; } }
        if (!b.onGround && b.y > GY) { b.y = GY; b.vy = 0; b.onGround = true; }
      } }),
    () => hideCell('stiff'), () => hideCell('peek'), () => hideCell('sweat'), () => hideCell('hug'),
    () => climbCell('climbing up', -1), () => climbCell('climbing down', 1), () => climbCell('holding still', 0),
    () => climbCell('holding, crown + danger', 0, true),
  ];
  const cells = MAKERS.map((f) => Object.assign(f(), { clock: 0 }));
  let shown = only.length ? only.map((i) => cells[i]).filter(Boolean) : cells, COLS = 4;
  if (qs.has('sheet')) {
    // Clones of one cell, each run ahead by i * gap seconds (drawn offscreen so the bear's own state advances).
    const off = document.createElement('canvas').getContext('2d'), n = +(qs.get('n') || 6), gap = +(qs.get('gap') || 0.05);
    const warm = +(qs.get('warm') || 1);
    shown = Array.from({ length: n }, (_, i) => {
      const c = Object.assign(MAKERS[+qs.get('sheet')](), { clock: 0 });
      for (let k = 0, steps = Math.round((warm + i * gap) * 60); k < steps; k++) {
        c.clock += 1 / 60; c.step(c.b, 1 / 60, c); drawCell(c, 0, off);
      }
      c.label += ' +' + (i * gap).toFixed(2) + ' s';
      return c;
    });
    ui.paused = true;
  }
  COLS = Math.min(qs.has('sheet') ? 3 : 4, shown.length);

  function trunk(ctx, t) {
    const half = t.w / 2, top = GY - t.h;
    ctx.fillStyle = '#9b958b';
    ctx.beginPath();
    ctx.moveTo(t.x - half - 7, GY); ctx.lineTo(t.x - half, GY - 16); ctx.lineTo(t.x - half + 2, top);
    ctx.lineTo(t.x + half - 2, top); ctx.lineTo(t.x + half, GY - 16); ctx.lineTo(t.x + half + 7, GY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(t.x + t.w * 0.12, top, t.w * 0.34, t.h - 16);
    ctx.fillStyle = 'rgba(60,50,40,0.28)';   // bark marks, to check that paws do not slide
    for (let i = 0, y = GY - 24; y > top + 10; i++, y -= 26) ctx.fillRect(t.x - half + 5 + (i % 2) * 14, y, 16, 2);
  }

  function ground(ctx, cx) {
    ctx.fillStyle = '#6b4f35'; ctx.fillRect(cx - CW, GY, CW * 2, 60);
    ctx.fillStyle = '#5f9a3e'; ctx.fillRect(cx - CW, GY, CW * 2, 9);
    ctx.strokeStyle = '#4f8a35'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = Math.floor((cx - CW) / 30) * 30; x < cx + CW; x += 30) { ctx.moveTo(x, GY + 2); ctx.lineTo(x - 3, GY - 7); }
    ctx.stroke();
  }

  function drawCell(c, i, ctx) {
    const b = c.b, ox = (i % COLS) * CW, oy = Math.floor(i / COLS) * CH;
    ctx.save();
    ctx.beginPath(); ctx.rect(ox + 2, oy + 2, CW - 4, CH - 4); ctx.clip();
    ctx.fillStyle = '#eaf4fb'; ctx.fillRect(ox, oy, CW, CH);
    const camX = c.follow ? b.x : 0, camY = c.climb ? Math.min(0, b.y - (GY - 40)) : 0;
    ctx.save();
    ctx.translate(ox + CW / 2 - camX, oy + FLOOR - GY - camY);
    ground(ctx, camX);
    if (c.floor && c.floor < GY) {   // the log the bear jumps onto
      ctx.fillStyle = '#7a5534'; ctx.fillRect(camX - 70, c.floor, 140, GY - c.floor);
      ctx.fillStyle = '#c9a77a'; ctx.fillRect(camX + 64, c.floor + 3, 6, GY - c.floor - 6);
    }
    if (c.tree && !b.hiding && !b.climbing) trunk(ctx, c.tree);
    const bearCall = (fn) => { ctx.globalAlpha = ALPHA; fn(ctx, b, c.clock); ctx.globalAlpha = 1; };
    if (b.hiding) { bearCall(ZS.drawBearBehindTree); trunk(ctx, c.tree); bearCall(ZS.drawBearInFront); }
    else if (b.climbing) { trunk(ctx, c.tree); bearCall(ZS.drawBearClimbing); }
    else bearCall(ZS.drawBear);
    if (b.climbing && b.covered) {
      // Where the crown would be; the game draws real leaves over the bear here.
      ctx.strokeStyle = 'rgba(79,138,69,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.ellipse(c.tree.x, b.y - 150, 120, 110, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
    ctx.fillStyle = '#f6f4ee'; ctx.fillRect(ox + 2, oy + CH - 24, CW - 4, 22);
    ctx.fillStyle = '#2a2f22'; ctx.font = '600 13px system-ui, sans-serif'; ctx.textBaseline = 'middle';
    const sub = c.sub ? c.sub(b) : '';
    ctx.fillText(c.label + (sub ? ' · ' + sub : ''), ox + 10, oy + CH - 13);
    ctx.restore();
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = document.documentElement.clientWidth;
    ui.scale = w / (COLS * CW);
    const h = Math.ceil(shown.length / COLS) * CH * ui.scale;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr * ui.scale, 0, 0, dpr * ui.scale, 0, 0);
  }

  function frame(ts) {
    const dt = Math.min(0.05, (ts - ui.last) / 1000 || 0);
    ui.last = ts;
    if (!ui.paused) {
      const step = dt * (ui.slow ? 0.25 : 1);
      for (const c of shown) { c.clock += step; c.step(c.b, step, c); }
    }
    ctx.fillStyle = '#c9d6bf'; ctx.fillRect(0, 0, COLS * CW, Math.ceil(shown.length / COLS) * CH);
    shown.forEach((c, i) => drawCell(c, i, ctx));
    requestAnimationFrame(frame);
  }

  function toggle(id, key) {
    ui[key] = !ui[key];
    document.getElementById(id).setAttribute('aria-pressed', String(ui[key]));
  }
  document.getElementById('pause').onclick = () => toggle('pause', 'paused');
  document.getElementById('slow').onclick = () => toggle('slow', 'slow');
  document.getElementById('flip').onclick = () => {
    ui.dir = -ui.dir;
    document.getElementById('flip').setAttribute('aria-pressed', String(ui.dir < 0));
    for (const c of shown) c.b.dir = ui.dir;
  };
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); toggle('pause', 'paused'); } });
  window.addEventListener('resize', resize);
  // For inspection: ZS.preview.cells, ZS.preview.ui.
  ZS.preview = { cells, shown, ui };
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
